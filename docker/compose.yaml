services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_URL: ${BACKEND_URL:-}
    volumes:
      - type: bind
        source: ../.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
