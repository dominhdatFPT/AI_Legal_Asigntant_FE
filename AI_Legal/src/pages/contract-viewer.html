<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xem biểu mẫu thủ tục</title><link rel="stylesheet" href="/contract-catalog.css"></head>
<body>
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <!-- user-header -->
  <main class="shell viewer-main" id="main">
    <a class="back-link" href="/document-storages">← Quay lại kho mẫu</a>
    <p id="viewer-status" role="status">Đang tải tài liệu…</p>
    <section id="viewer" class="reader-layout" hidden>
      <aside class="reader-info"><p class="section-label">Biểu mẫu thủ tục</p><h1 id="viewer-title"></h1><p id="viewer-description"></p>
        <dl><div><dt>Lĩnh vực</dt><dd id="viewer-domain"></dd></div><div><dt>Thủ tục</dt><dd id="viewer-procedure"></dd></div><div><dt>Tài liệu</dt><dd id="viewer-page-count"></dd></div></dl>
      </aside>
      <div class="reader-document"><div class="reader-toolbar"><strong>Nội dung tài liệu</strong><span id="reader-total"></span></div><div id="viewer-pages" class="paper-stack"></div>
      </div>
    </section>
  </main>
  <script type="module" src="/contract-viewer.js"></script>
</body></html>
