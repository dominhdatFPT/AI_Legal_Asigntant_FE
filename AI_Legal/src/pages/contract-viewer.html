<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xem biểu mẫu thủ tục</title><link rel="stylesheet" href="/contract-catalog.css"></head>
<body>
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header class="site-header"><div class="shell header-inner"><a class="brand" href="/kho-mau-don-tham-khao"><img src="/images/national-service-logo.png" width="52" height="52" alt=""><span><strong>Cổng Dịch vụ công Quốc gia</strong><small>Hệ thống thông tin giải quyết thủ tục hành chính</small></span></a><a class="account-link" href="/account">Tài khoản ↗</a></div></header>
  <div class="nav-bar"><nav class="shell main-nav" aria-label="Điều hướng chính"><a href="/user-dashboard">Tổng quan hồ sơ</a><a href="/applicationSubmission">Tạo hồ sơ</a><a href="/kho-mau-don-tham-khao" aria-current="page">Kho biểu mẫu</a><a href="/account">Tài khoản</a></nav></div>
  <main class="shell viewer-main" id="main">
    <a class="back-link" href="/kho-mau-don-tham-khao">← Quay lại kho mẫu</a>
    <p id="viewer-status" role="status">Đang tải tài liệu…</p>

      </aside>
      <div class="reader-document"><div class="reader-toolbar"><strong>Nội dung tài liệu</strong><span id="reader-total"></span></div><div id="viewer-pages" class="paper-stack"></div>
      </div>
    </section>
  </main>
  <script type="module" src="/contract-viewer.js"></script>
