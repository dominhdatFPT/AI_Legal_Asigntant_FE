<!DOCTYPE html><html class="h-full bg-white" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Đăng ký - Hệ thống Hỗ trợ Hồ sơ Đất đai &amp; Hộ kinh doanh</title>
<!-- Google Fonts: Be Vietnam Pro -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&amp;display=swap" rel="stylesheet">
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS with custom configuration -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#DA251D",
            "primary-hover": "#c01f18",
            "gold-star": "#FFCD00",
            "border-subtle": "#E2E8F0"
          },
          fontFamily: {
            sans: ["Be Vietnam Pro", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="h-full min-h-screen font-sans text-gray-900 bg-white antialiased">
<!-- Split-Screen Container -->
<div class="min-h-screen w-full flex flex-col lg:flex-row">
<!-- LEFT PANEL (60% width Desktop): Scenic Background & Institutional Identity -->
<section class="relative w-full lg:w-[60%] min-h-[420px] lg:min-h-screen flex flex-col justify-center items-center overflow-hidden">
<!-- Background Image -->
<img alt="Breathtaking terraced rice fields in Vietnam" class="absolute inset-0 w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtZALkyxJ2K_bHEUuUHMPnZ7QBu39GpwOZfuFAjpq_fewFBEzDfQWjFkSfT8HhfpVA6_c5CiK9FhBfuLPRwXvH3S05jg-4XWH0oYHz2wpww60ROkExIJZqx4Z2c6rI6SYG2n2WaudK2YEITAb3vKRmPEqUBh9mMCB1ylrWUShQC0jXuH3vHAMtcTsF1mcpbv6trlTFN9sHiFvO33psnSw2jsWCJtqtkW-coftmHnhcmI63zM_9nYle">
<!-- Semi-transparent Red Overlay -->
<div class="absolute inset-0 bg-[#DA251D]/60 backdrop-brightness-95"></div>
<!-- Left Panel Content -->
<div class="relative z-10 w-full max-w-2xl px-8 py-12 lg:p-16 flex flex-col items-center text-center text-white">
<!-- Glowing Yellow-Gold 5-Pointed Star -->
<div class="mb-6 flex items-center justify-center">
<svg class="w-14 h-14 text-[#FFCD00] drop-shadow-[0_0_18px_rgba(255,205,0,0.7)]" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
</svg>
</div>
<!-- Main Title -->
<h1 class="text-4xl lg:text-5xl font-bold tracking-tight text-white drop-shadow-sm leading-tight">
          Hệ thống Hỗ trợ Hồ sơ
        </h1>
<!-- Subtitle -->
<p class="mt-2 text-2xl lg:text-3xl font-medium text-white/95 tracking-normal">
          Đất đai &amp; Hộ kinh doanh
        </p>
<!-- 3 Pill Badges / Buttons -->
<div class="mt-8 flex flex-wrap items-center justify-center gap-3">
<div class="bg-white/20 backdrop-blur-md text-white border border-white/30 rounded-full px-5 py-2 text-sm font-medium flex items-center gap-2 hover:bg-white/30 transition-all cursor-default select-none shadow-sm">
<span class="material-symbols-outlined text-base">search</span>
<span class="">Tra cứu</span>
</div>
<div class="bg-white/20 backdrop-blur-md text-white border border-white/30 rounded-full px-5 py-2 text-sm font-medium flex items-center gap-2 hover:bg-white/30 transition-all cursor-default select-none shadow-sm">
<span class="material-symbols-outlined text-base">edit_document</span>
<span class="">Điền hồ sơ</span>
</div>
<div class="bg-white/20 backdrop-blur-md text-white border border-white/30 rounded-full px-5 py-2 text-sm font-medium flex items-center gap-2 hover:bg-white/30 transition-all cursor-default select-none shadow-sm">
<span class="material-symbols-outlined text-base">cloud_upload</span>
<span class="">Nộp trực tuyến</span>
</div>
</div>
</div>
</section>
<!-- RIGHT PANEL (40% width Desktop): Pure Clean Minimal Registration Form -->
<section class="w-full lg:w-[40%] bg-white flex flex-col justify-center items-center px-6 py-10 lg:py-16">
<div class="w-full max-w-md px-2 sm:px-6 flex flex-col justify-center">
<!-- Logo Emblem -->
<div class="flex justify-center mb-1">
<div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center text-[#DA251D]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
</div>
<!-- Title & Subtitle -->
<h2 class="text-3xl font-bold text-gray-900 text-center mt-3 tracking-tight">Đăng ký</h2>
<p class="text-sm text-gray-500 text-center mt-1 mb-8">Tạo tài khoản để sử dụng dịch vụ</p>
<!-- Registration Form (Only 3 fields) -->
<form class="space-y-5" onsubmit="event.preventDefault(); const password = this.querySelector('#password').value; const confirmation = this.querySelector('#confirm-password').value; if (password !== confirmation) { alert('Mật khẩu xác nhận không khớp.'); return; } window.location.href = '/login?registered=1';">
<!-- 1. Tên đăng nhập -->
<div>
<label class="block text-sm font-semibold text-gray-700 mb-1.5" for="username">Số CCCD <span class="text-[#DA251D]">*</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
<span class="material-symbols-outlined text-xl">person</span>
</div>
<input class="w-full h-12 pl-11 pr-4 bg-white border border-gray-300 rounded-lg text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#DA251D] focus:ring-2 focus:ring-[#DA251D]/20 transition-all" id="username" name="username" placeholder="Nhập 12 số CCCD" required="" type="text">
</div>
</div>
<!-- 2. Mật khẩu -->
<div>
<label class="block text-sm font-semibold text-gray-700 mb-1.5" for="password">
              Mật khẩu <span class="text-[#DA251D]">*</span>
</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
<input class="w-full h-12 pl-11 pr-11 bg-white border border-gray-300 rounded-lg text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#DA251D] focus:ring-2 focus:ring-[#DA251D]/20 transition-all" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password">
<button aria-label="Hiện hoặc ẩn mật khẩu" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none" id="toggle-pwd-1" onclick="togglePasswordVisibility('password', 'pwd-icon-1')" type="button">
<span class="material-symbols-outlined text-xl" id="pwd-icon-1">visibility</span>
</button>
</div>
</div>
<!-- 3. Xác nhận mật khẩu -->
<div>
<label class="block text-sm font-semibold text-gray-700 mb-1.5" for="confirm-password">
              Xác nhận mật khẩu <span class="text-[#DA251D]">*</span>
</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
<input class="w-full h-12 pl-11 pr-11 bg-white border border-gray-300 rounded-lg text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#DA251D] focus:ring-2 focus:ring-[#DA251D]/20 transition-all" id="confirm-password" name="confirm-password" placeholder="Nhập lại mật khẩu" required="" type="password">
<button aria-label="Hiện hoặc ẩn xác nhận mật khẩu" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none" id="toggle-pwd-2" onclick="togglePasswordVisibility('confirm-password', 'pwd-icon-2')" type="button">
<span class="material-symbols-outlined text-xl" id="pwd-icon-2">visibility</span>
</button>
</div>
</div>
<!-- Checkbox: Terms -->
<div class="flex items-center space-x-2.5 pt-1">
<input class="w-4 h-4 rounded border-gray-300 text-[#DA251D] focus:ring-[#DA251D]/25 cursor-pointer accent-[#DA251D]" id="terms" name="terms" required="" type="checkbox">
<label class="text-sm text-gray-600 cursor-pointer select-none" for="terms">
              Tôi đồng ý với <a class="text-[#DA251D] font-medium hover:underline" href="#dieu-khoan">Điều khoản sử dụng</a>
</label>
</div>
<!-- Primary Red Button -->
<button class="w-full py-3.5 bg-[#DA251D] hover:bg-[#c01f18] text-white rounded-lg font-semibold text-base shadow-md transition-colors active:scale-[0.99] flex items-center justify-center space-x-2 mt-2" type="submit">
<span class="">Đăng ký</span>
</button>
<!-- Navigation Link -->
<div class="text-center pt-3">
<p class="text-sm text-gray-600">
              Đã có tài khoản? 
              <a class="text-[#DA251D] font-semibold hover:underline ml-1" href="/login">Đăng nhập</a>
</p>
</div>
</form>
</div>
</section>
</div>
<!-- Toggle Password Visibility Script -->
<script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>


</body></html>
