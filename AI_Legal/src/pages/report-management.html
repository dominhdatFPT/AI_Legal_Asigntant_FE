<!DOCTYPE html>
<html lang="vi" style="">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_dashboard" name="shell-type">
  <title>Quản lí báo cáo - AI Legal Assistant</title>
  
  <!-- Fonts & Icons matching dashboard.html -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <!-- Material Symbols: chỉ tải các icon có trong icon_names (~26 KB thay vì ~4 MB). Dùng icon mới thì thêm tên vào icon_names (giữ thứ tự a→z) ở MỌI trang, nếu không icon sẽ hiện thành chữ. --><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..700,0..1,0&amp;icon_names=account_balance,account_balance_wallet,add_business,add_circle,add_location_alt,admin_panel_settings,apartment,arrow_back,arrow_forward,assignment_late,assured_workload,auto_awesome,auto_fix_high,backspace,badge,calendar_clock,calendar_month,calendar_today,call,chat,check,check_circle,chevron_left,chevron_right,child_friendly,close,cloud_done,cloud_off,content_cut,credit_card,delete,delete_forever,description,directions_car,diversity_3,document_scanner,domain,download,download_done,edit,edit_document,edit_note,error,event_available,event_busy,event_repeat,expand_more,face,fact_check,favorite,flag,folder_open,folder_shared,folder_special,grid_view,group,headset_mic,help,history_edu,home,home_pin,hourglass_top,id_card,info,landscape,location_on,lock,login,logout,mail,manage_accounts,map,memory,notification_important,notifications,notifications_active,password,pause,payments,pending_actions,person,person_add,person_search,phone_iphone,photo_camera_front,print,priority_high,qr_code_2,real_estate_agent,receipt_long,restart_alt,save,schedule,search,security,send,shield_locked,shield_with_heart,star,stars,store,storefront,sync,task_alt,timelapse,track_changes,travel_explore,trending_up,upload_file,verified,verified_user,visibility,visibility_off,warning&amp;display=block" rel="stylesheet">

  <style>
    /* Khong boc @layer base: CSS build tinh khong phat sinh cascade layer nen rule o day phai thang preflight. */
    html, body {
      margin: 0;
      padding: 0;
    }
    body {
      overscroll-behavior: none;
    }
    main > :first-child {
      margin-top: 0 !important;
    }
    main > :last-child {
      margin-bottom: 0 !important;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>

  <!-- Tailwind CSS build tinh (npm run css:build:admin). Bang mau/co chu xem tailwind.admin.config.js -->
  <link rel="stylesheet" href="/tailwind-admin.css">
  <link rel="stylesheet" href="/admin-ai-chat.css">
  <link rel="stylesheet" href="/admin-dashboard.css">
  <link rel="stylesheet" href="/report-admin.css">
</head>

<body class="admin-dashboard">
  <!-- admin-sidebar -->

  <div class="admin-layout">
    <!-- admin-topbar -->

    <main class="admin-main">
      <div class="admin-content">
        <section class="ra-hero" aria-labelledby="ra-title">
          <div>
            <h1 id="ra-title">Quản lí báo cáo</h1>
            <p>Xem và xử lý báo cáo lỗi web, báo cáo người dùng do người dân và luật sư gửi lên. Người gửi nhận thông báo khi bạn xử lý xong.</p>
          </div>
          <dl class="ra-stats">
            <div><dt>Chờ xử lý</dt><dd id="ra-stat-pending">0</dd></div>
            <div><dt>Đã xử lý</dt><dd id="ra-stat-resolved">0</dd></div>
            <div><dt>Đã bỏ qua</dt><dd id="ra-stat-dismissed">0</dd></div>
          </dl>
        </section>

        <section class="ra-panel" aria-label="Danh sách báo cáo">
          <div class="ra-toolbar">
            <div class="ra-tabs" id="ra-tabs" aria-label="Lọc theo trạng thái">
              <button type="button" data-status="pending" aria-pressed="true">Chờ xử lý <span data-count="pending">0</span></button>
              <button type="button" data-status="resolved" aria-pressed="false">Đã xử lý <span data-count="resolved">0</span></button>
              <button type="button" data-status="dismissed" aria-pressed="false">Đã bỏ qua <span data-count="dismissed">0</span></button>
              <button type="button" data-status="all" aria-pressed="false">Tất cả <span data-count="all">0</span></button>
            </div>
            <div class="ra-filters">
              <label class="ra-search">
                <span class="material-symbols-outlined" aria-hidden="true">search</span>
                <span class="ra-sr">Tìm báo cáo</span>
                <input id="ra-search" type="search" placeholder="Tìm theo tiêu đề, người gửi, người bị báo cáo" autocomplete="off">
              </label>
              <label class="ra-sr" for="ra-type">Loại báo cáo</label>
              <select id="ra-type">
                <option value="">Tất cả loại</option>
                <option value="bug">Lỗi trang web</option>
                <option value="user">Báo cáo người dùng</option>
              </select>
            </div>
          </div>
          <ul class="ra-list" id="ra-list"></ul>
          <p class="ra-empty" id="ra-empty" hidden>Không có báo cáo nào phù hợp.</p>
        </section>
      </div>
    </main>
  </div>

  <dialog class="ra-dialog" id="ra-dialog" aria-labelledby="ra-dialog-title">
    <form method="dialog" class="ra-dialog-card" id="ra-dialog-form">
      <header class="ra-dialog-head">
        <div>
          <div class="ra-row-meta" id="ra-dialog-meta"></div>
          <h2 id="ra-dialog-title"></h2>
        </div>
        <button type="submit" value="cancel" class="ra-icon-button" aria-label="Đóng"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
      </header>
      <dl class="ra-detail" id="ra-detail"></dl>
      <div class="ra-field" id="ra-note-field">
        <label for="ra-note">Phản hồi cho người gửi <span class="ra-optional">(không bắt buộc)</span></label>
        <textarea id="ra-note" rows="3" maxlength="500" placeholder="Ví dụ: đã sửa lỗi, bạn thử lại giúp nhé"></textarea>
      </div>
      <footer class="ra-dialog-actions" id="ra-actions-pending">
        <button type="submit" value="dismissed" class="ra-button">Bỏ qua báo cáo</button>
        <button type="submit" value="resolved" class="ra-button ra-button--primary"><span class="material-symbols-outlined" aria-hidden="true">task_alt</span>Đánh dấu đã xử lý</button>
      </footer>
      <footer class="ra-dialog-actions" id="ra-actions-done" hidden>
        <button type="submit" value="cancel" class="ra-button">Đóng</button>
      </footer>
    </form>
  </dialog>

  <div class="ra-toast" id="ra-toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/report-admin.js"></script>
  <script type="module" src="/admin-ai-chat.js"></script>
</body>

</html>
