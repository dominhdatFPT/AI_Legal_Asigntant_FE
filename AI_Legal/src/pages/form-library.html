<!DOCTYPE html>

<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta content="web_standard" name="shell-type" />
  <title>Mẫu đơn tham khảo - AI Legal Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <style>
    @layer base {

      html,
      body {
        margin: 0;
        padding: 0;
      }

      main>:first-child {
        margin-top: 0 !important;
      }

      main>:last-child {
        margin-bottom: 0 !important;
      }
    }
  </style>
  <link rel="stylesheet" href="/tailwind-user.css">
  <style id="auth-pending">
    body {
      visibility: hidden !important
    }
  </style>
  <link rel="stylesheet" href="/admin-ai-chat.css">
</head>

<body class="bg-background font-body-md text-body-md text-on-surface antialiased"><!-- user-header -->
  <main id="form-library-main" class="w-full bg-surface min-h-[calc(100vh-16rem)]">
    <section class="bg-gradient-to-r from-tertiary via-primary-container to-primary text-on-primary">
      <div class="max-w-7xl mx-auto px-margin py-space-xl">
        <span
          class="flex items-center gap-space-xs font-label-md text-label-md uppercase tracking-wider text-on-primary-container"><span
            class="material-symbols-outlined text-title-sm" aria-hidden="true">folder_special</span>Thư viện biểu
          mẫu</span>
        <h1 class="font-display text-display-mobile md:text-display mt-space-sm">Mẫu đơn tham khảo</h1>
        <p class="font-body-lg text-body-lg text-on-primary-container mt-space-xs">Tra cứu, xem và tải các mẫu đơn, tờ
          khai thường dùng khi làm thủ tục đất đai và kinh doanh.</p>
      </div>
    </section>
    <div class="max-w-7xl mx-auto px-margin py-space-xl flex flex-col gap-space-lg">
      <div
        class="bg-surface-container-lowest rounded-xl shadow-[0_2px_12px_rgba(28,25,23,0.06)] p-space-md flex flex-col gap-space-md">
        <!-- 2 Ô chọn Lĩnh vực và Thủ tục chi tiết -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
          <div class="flex flex-col gap-1.5">
            <label for="select-domain"
              class="font-label-lg text-label-lg font-semibold text-on-surface flex items-center gap-1.5">
              <span class="material-symbols-outlined text-title-sm text-primary" aria-hidden="true">category</span>
              <span>1. Lĩnh vực thủ tục</span>
            </label>
            <div class="relative">
              <select id="select-domain"
                class="w-full h-12 appearance-none bg-surface-container-low border border-outline/20 hover:border-primary/50 focus:border-primary focus:ring-2 focus:ring-primary/20 rounded-xl px-space-md pr-10 font-body-md text-on-surface outline-none transition-all cursor-pointer font-medium">
                <option value="all">Tất cả lĩnh vực</option>
                <option value="land">Đất đai & Bất động sản</option>
                <option value="business">Doanh nghiệp & Hộ kinh doanh</option>
              </select>
              <span
                class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant text-xl"
                aria-hidden="true">expand_more</span>
            </div>
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="select-procedure"
              class="font-label-lg text-label-lg font-semibold text-on-surface flex items-center gap-1.5">
              <span class="material-symbols-outlined text-title-sm text-primary" aria-hidden="true">assignment</span>
              <span>2. Thủ tục chi tiết</span>
            </label>
            <div class="relative">
              <select id="select-procedure"
                class="w-full h-12 appearance-none bg-surface-container-low border border-outline/20 hover:border-primary/50 focus:border-primary focus:ring-2 focus:ring-primary/20 rounded-xl px-space-md pr-10 font-body-md text-on-surface outline-none transition-all cursor-pointer font-medium">
                <option value="all">Tất cả thủ tục chi tiết</option>
              </select>
              <span
                class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant text-xl"
                aria-hidden="true">expand_more</span>
            </div>
          </div>
        </div>

        <!-- Tìm kiếm nhanh từ khóa -->
        <label
          class="flex items-center gap-space-sm bg-surface-container-low border border-outline/20 hover:border-primary/50 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 rounded-xl px-space-md h-12 transition-all">
          <span class="material-symbols-outlined text-on-surface-variant" aria-hidden="true">search</span>
          <input id="form-search" type="search"
            class="flex-1 bg-transparent border-0 outline-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant"
            placeholder="Nhập tên mẫu đơn cần tìm (gõ không dấu cũng được)..." aria-label="Tìm mẫu đơn">
        </label>
      </div>
      <p id="form-count" class="font-label-lg text-label-lg text-on-surface-variant"></p>
      <ul id="form-list" class="grid grid-cols-1 md:grid-cols-2 gap-space-md"></ul>
      <p id="form-empty" class="hidden text-center py-space-xl font-body-lg text-body-lg text-on-surface-variant">Không
        tìm thấy mẫu đơn phù hợp.</p>
    </div>
  </main><!-- user-footer -->
  <script type="module">
    // Chưa đăng nhập → /login; sai vai trò → trang đúng vai trò; hợp lệ → điền thông tin user.
    import { protectPage } from '/auth-api.js';
    await protectPage(['citizen', 'lawyer']);
  </script>
  <script type="module" src="/form-library.js"></script>
  <script type="module" src="/admin-ai-chat.js"></script>
</body>

</html>
